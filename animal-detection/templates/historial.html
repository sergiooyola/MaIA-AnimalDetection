<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial</title>

    <style>
        body {
            background:#121212;
            color:#eee;
            font-family:Arial;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align:center;
            background:#1f1f1f;
            padding:20px;
            color:#58a6ff;
            margin: 0;
        }
        table {
            width:90%;
            margin:auto;
            border-collapse:collapse;
            margin-top:30px;
        }
        th, td {
            padding:10px;
            border-bottom:1px solid #333;
            text-align:center;
        }
        th {
            background:#272727;
        }
    </style>
</head>

<body>
<h1>Historial de inferencias</h1>

<table>
    <tr>
        <th>Fecha</th>
        <th>Imagen</th>
        <th>Especies</th>
        <th>Cantidad</th>
        <th>Overlap</th>
    </tr>

    {% for row in rows %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{ row[4] }}</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
